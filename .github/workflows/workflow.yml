# File: .github/workflows/workflow.yml

on: [push]

name: deploy_themes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Azure CLI script
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az storage blob upload-batch --account-name samywplab --auth-mode login -d 'wordpress-content/wp-content/' -s themes/