on: [push]

name: deploy_themes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.1
        id: oci-setup
        with:
          command: setup config
          oci_cli_user: ${{ secrets.OCI_USER_OCID }}
          oci_cli_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_cli_region: eu-frankfurt-1
          oci_cli_key_content: ${{ secrets.OCI_PRIVATE_KEY }}
          oci_cli_fingerprint: ${{ secrets.OCI_KEY_FINGERPRINT }}

      - name: Upload themes to OCI Object Storage
        run: |
          oci os object bulk-upload \
            --namespace ${{ secrets.OCI_OBJECT_STORAGE_NAMESPACE }} \
            --bucket-name wordpress-content-mywplab \
            --src-dir themes/ \
            --object-prefix wp-content/ \
            --auth api_key
