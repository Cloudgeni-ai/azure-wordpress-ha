# File: .github/workflows/cloudgeni-terraform-validate.yml

name: Cloudgeni Terraform Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Create Backend Override for Plan
        run: |
          cat > backend_override.tf <<EOF
          terraform {
            backend "local" {}
          }
          EOF

      - name: Reinitialize with Local Backend
        run: terraform init -reconfigure -backend=true

      - name: Terraform Plan
        run: terraform plan -input=false
        continue-on-error: true
